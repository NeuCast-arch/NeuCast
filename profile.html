<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F6F8">
    <title>My Profile - NeuCast</title>
    <script src="theme.js"></script>
    <script src="animations.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="skeleton.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="animations.css">
</head>

<body class="auth-page">
    <a class="skip-link" href="#main">Skip to your profile</a>
    <noscript><p class="alert alert--warning" style="margin:1rem">NeuCast needs JavaScript to show your profile. Please turn it on in your browser.</p></noscript>

    <div class="auth auth--single">
        <main id="main" class="auth-main" tabindex="-1">
            <div class="auth-main__inner">

                <div class="auth-topbar">
                    <a class="brand" href="index.html">
                        <span class="brand-mark" data-icon="neucast" aria-hidden="true"></span>
                        <span class="brand-text"><span class="brand-name">NeuCast</span><span class="brand-sub">New Era University</span></span>
                    </a>
                    <a href="index.html" class="btn btn--secondary btn--sm"><span data-icon="arrowleft"></span> Back to announcements</a>
                </div>

                <div class="panel auth-card">
                    <h1>My profile</h1>
                    <p class="auth-sub">Update your details.</p>

                    <!-- Placeholder with the same footprint as the form; profile.js removes it -->
                    <div id="profileSkeleton" aria-busy="true">
                        <div class="sk-form" aria-hidden="true">
                            <span class="sk sk-block wide"></span>
                            <span class="sk sk-block"></span>
                            <span class="sk sk-block"></span>
                            <span class="sk sk-block"></span>
                            <span class="sk sk-block"></span>
                            <span class="sk sk-block wide" style="width:100%"></span>
                        </div>
                        <span class="sk-status">Loading your profile...</span>
                    </div>

                    <div id="profileContent" hidden>
                        <form id="profileForm" class="auth-form" novalidate>
                            <div class="field field--wide">
                                <label for="fullName">Full name</label>
                                <input type="text" id="fullName" class="input" autocomplete="name" aria-required="true">
                            </div>
                            <div class="field">
                                <label for="studentId">Student ID number</label>
                                <input type="text" id="studentId" class="input" readonly aria-describedby="lockedHint">
                            </div>
                            <div class="field">
                                <label for="email">Email</label>
                                <input type="email" id="email" class="input" readonly aria-describedby="lockedHint">
                            </div>
                            <p id="lockedHint" class="field__hint">Your student ID and email can't be changed.</p>
                            <div class="field">
                                <label for="course">Course</label>
                                <select id="course" class="input"></select>
                            </div>
                            <div class="field">
                                <label for="year">Year level</label>
                                <select id="year" class="input"></select>
                            </div>

                            <p id="profileMessage" class="login-message" role="status" hidden></p>

                            <button type="submit" id="profileBtn" class="btn btn--block">Save changes</button>
                        </form>

                        <h2 class="auth-section-title">Change password</h2>

                        <form id="passwordForm" class="auth-form auth-form--single" novalidate>
                            <div class="field">
                                <label for="currentPassword">Current password</label>
                                <input type="password" id="currentPassword" class="input" placeholder="Enter your current password" autocomplete="current-password" aria-required="true">
                            </div>
                            <div class="field">
                                <label for="newPassword">New password</label>
                                <input type="password" id="newPassword" class="input" placeholder="At least 6 characters" autocomplete="new-password" aria-required="true" aria-describedby="newPasswordHint">
                                <span id="newPasswordHint" class="field__hint">At least 6 characters, and different from the current one.</span>
                            </div>
                            <div class="field">
                                <label for="confirmNewPassword">Confirm new password</label>
                                <input type="password" id="confirmNewPassword" class="input" placeholder="Repeat the new password" autocomplete="new-password" aria-required="true">
                            </div>

                            <p id="passwordMessage" class="login-message" role="status" hidden></p>

                            <button type="submit" id="passwordBtn" class="btn btn--block">Change password</button>
                        </form>

                        <div class="profile-actions">
                            <button id="logoutBtn" type="button" class="btn btn--danger btn--block"><span data-icon="logout"></span> Log out</button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="boot.js" data-scripts="icons.js ui.js cloud-config.js cloud.js data.js profile.js"></script>
</body>
</html>
